name: Manual Fresh RS3 Tracker Refresh

on:
  push:
    paths:
      - 'leagues-tracker/manual-trigger.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-main:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tracker from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run check-leagues-profile.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched fresh tracker run from current main."
