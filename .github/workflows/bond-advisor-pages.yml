name: Build RS3 Bond Advisor Pages

on:
  workflow_dispatch:
    inputs:
      rsn:
        description: "RuneScape display name. Optional; falls back to manual_profile.json."
        required: false
        type: string
      hiscores_mode:
        description: "Hiscores table"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - ironman
          - hardcore_ironman
      llm_provider:
        description: "LLM provider"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - groq
          - openai
          - none
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bond-advisor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build advisor context
        env:
          INPUT_RSN: ${{ inputs.rsn }}
          INPUT_MODE: ${{ inputs.hiscores_mode }}
        run: |
          MODE="${INPUT_MODE:-normal}"
          if [ -n "$INPUT_RSN" ]; then
            python scripts/build_context.py --rsn "$INPUT_RSN" --mode "$MODE"
          else
            python scripts/build_context.py --mode "$MODE"
          fi

      - name: Score methods
        run: python scripts/score_methods.py

      - name: Generate daily plan
        env:
          ADVISOR_LLM_PROVIDER: ${{ inputs.llm_provider || vars.ADVISOR_LLM_PROVIDER || 'auto' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/ask_openai.py

      - name: Prepare static site output
        run: python scripts/prepare_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bond-advisor/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
