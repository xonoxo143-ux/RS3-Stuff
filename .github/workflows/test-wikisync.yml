name: Test RS3 WikiSync Tasks

on:
  push:
    paths:
      - '.github/workflows/test-wikisync.yml'
  workflow_dispatch:

jobs:
  test-wikisync:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WikiSync profiles
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sync.runescape.wiki/runescape/player/112321'
          UA='RS3-Stuff-Leagues-Tracker/1.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'

          for PROFILE in LEAGUE_2 EQUILIBRIUM LEAGUE_1 STANDARD; do
            echo "=== $PROFILE ==="
            CODE=$(curl -sS -L --compressed \
              --connect-timeout 20 --max-time 60 \
              -A "$UA" \
              -o "${PROFILE}.json" \
              -w '%{http_code}' \
              "$BASE/$PROFILE")
            echo "HTTP_STATUS=$CODE"
            python3 - "$PROFILE" <<'PY'
          import json, sys
          p = sys.argv[1]
          raw = open(f'{p}.json', encoding='utf-8').read()
          print('BODY_PREFIX=', raw[:500].replace('\n',' '))
          try:
              data = json.loads(raw)
          except Exception as e:
              print('JSON_ERROR=', repr(e))
              raise SystemExit
          print('KEYS=', sorted(data.keys()))
          tasks = data.get('league_tasks')
          if tasks is not None:
              print('LEAGUE_TASKS_COUNT=', len(tasks))
              print('LEAGUE_TASKS_SAMPLE=', tasks[:25])
          levels = data.get('levels')
          if levels is not None:
              print('LEVELS_TYPE=', type(levels).__name__)
          PY
            echo
          done
