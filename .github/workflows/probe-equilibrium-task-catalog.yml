name: Probe Equilibrium Task Catalog

on:
  push:
    paths:
      - '.github/workflows/probe-equilibrium-task-catalog.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded task schema
        shell: bash
        run: |
          set -euo pipefail
          URL='https://scapeleagues.com/rs3/equilibrium/tasks'
          UA='RS3-Stuff-Leagues-Tracker/1.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          curl -sS -L --compressed -A "$UA" -o tasks.html "$URL"
          python3 - <<'PY'
          import json, re
          raw = open('tasks.html', encoding='utf-8').read()

          decoded_chunks = []
          for m in re.finditer(r'self\.__next_f\.push\(\[1,("(?:\\.|[^"\\])*")\]\)', raw, re.S):
              try:
                  decoded_chunks.append(json.loads(m.group(1)))
              except Exception:
                  pass
          decoded = '\n'.join(decoded_chunks)
          print('decoded_chars=', len(decoded))

          dec = json.JSONDecoder()
          tasks = {}
          pos = 0
          while True:
              pos = decoded.find('{"id":"', pos)
              if pos < 0:
                  break
              try:
                  obj, end = dec.raw_decode(decoded[pos:])
              except Exception:
                  pos += 1
                  continue
              pos += max(end, 1)
              if isinstance(obj, dict) and {'id','name','tier','region','points'} <= set(obj):
                  tasks[str(obj['id'])] = obj

          print('TASK_COUNT=', len(tasks))
          all_keys = sorted({k for t in tasks.values() for k in t})
          print('ALL_KEYS=', all_keys)
          extras = [t for t in tasks.values() if set(t) - {'id','name','description','tier','region','points'}]
          print('EXTRA_FIELD_TASKS=', len(extras))
          for t in extras[:30]:
              print(json.dumps(t, ensure_ascii=False, sort_keys=True))

          for tid in ['0','3','27','28','190','612','1146']:
              if tid in tasks:
                  print('SAMPLE', tid, json.dumps(tasks[tid], ensure_ascii=False, sort_keys=True))
          PY
