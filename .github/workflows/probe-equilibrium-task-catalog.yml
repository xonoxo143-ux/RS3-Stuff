name: Probe Equilibrium Task Catalog

on:
  push:
    paths:
      - '.github/workflows/probe-equilibrium-task-catalog.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ScapeLeagues task data source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://scapeleagues.com/rs3/equilibrium/tasks'
          UA='RS3-Stuff-Leagues-Tracker/1.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          curl -sS -L --compressed -A "$UA" -o tasks.html "$URL"
          echo "SIZE=$(wc -c < tasks.html)"
          echo '--- script/src hints ---'
          grep -oE 'https?://[^"'"' ]+|/[^"'"' ]+\.(json|js)(\?[^"'"' ]*)?' tasks.html | head -n 200 || true
          echo '--- framework/data hints ---'
          grep -oiE '__NEXT_DATA__|self\.__next_f\.push|application/ld\+json|application/json|task[^<]{0,80}|knownIssue|blessing|difficulty|region' tasks.html | head -n 250 || true
          echo '--- first 5000 chars ---'
          head -c 5000 tasks.html
          echo
