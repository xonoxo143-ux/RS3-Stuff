name: Probe Current RS3 Leagues Sources

on:
  push:
    paths:
      - '.github/workflows/probe-current-leagues.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live WikiSync
        shell: bash
        run: |
          set -euo pipefail
          UA='RS3-Stuff-Leagues-Probe/1.1 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          curl -sS -L --compressed -A "$UA" -o leagues-tracker/live-wikisync.json 'https://sync.runescape.wiki/runescape/player/112321/LEAGUE_2'
      - name: Commit live probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add leagues-tracker/live-wikisync.json
          git commit -m 'Refresh live WikiSync probe' || exit 0
          git push
