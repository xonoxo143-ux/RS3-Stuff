name: Refresh Equilibrium Tracker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-current-leagues.yml'
      - 'leagues-tracker/refresh-token.txt'
      - 'leagues-tracker/tracker.py'
      - 'leagues-tracker/task_intelligence.py'
      - 'leagues-tracker/opportunity_detector.py'
      - 'leagues-tracker/test_tracker.py'
      - 'leagues-tracker/test_opportunities.py'
      - 'leagues-tracker/league-rules.json'
      - 'leagues-tracker/player-state.json'
      - 'leagues-tracker/task-overrides.json'
      - 'leagues-tracker-112321-2/**'

permissions:
  contents: write

concurrency:
  group: equilibrium-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Snap checkout to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch authoritative WikiSync state
        shell: bash
        run: |
          set -euo pipefail
          UA='RS3-Stuff-Equilibrium-Tracker/5.3 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o leagues-tracker/live-wikisync.json \
            'https://sync.runescape.wiki/runescape/player/112321/LEAGUE_2'
          if ! curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o leagues-tracker-112321-2/live-wikisync.json.tmp \
            'https://sync.runescape.wiki/runescape/player/112321-2/LEAGUE_2'; then
            echo 'Warning: WikiSync refresh for 112321-2 failed; skipping F2P tracker for this run.'
            rm -f leagues-tracker-112321-2/live-wikisync.json.tmp
            touch .skip-f2p-tracker
          else
            mv leagues-tracker-112321-2/live-wikisync.json.tmp leagues-tracker-112321-2/live-wikisync.json
          fi

      - name: Fetch optional task catalog refresh
        shell: bash
        run: |
          set -u
          UA='RS3-Stuff-Equilibrium-Tracker/5.3 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          rm -f task-catalog.html
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o task-catalog.html \
            'https://scapeleagues.com/rs3/equilibrium/tasks' || rm -f task-catalog.html

      - name: Compile tracker code
        run: >-
          python3 -m py_compile
          leagues-tracker/tracker.py
          leagues-tracker/task_intelligence.py
          leagues-tracker/opportunity_detector.py
          leagues-tracker/test_tracker.py
          leagues-tracker/test_opportunities.py

      - name: Build tracker intelligence
        run: |
          python3 leagues-tracker/tracker.py
          if [ -f .skip-f2p-tracker ]; then
            echo 'Skipping 112321-2 tracker build because WikiSync data is unavailable.'
          else
            python3 leagues-tracker-112321-2/tracker.py
          fi

      - name: Detect forgotten finishes
        run: |
          python3 leagues-tracker/opportunity_detector.py
          if [ -f .skip-f2p-tracker ]; then
            echo 'Skipping 112321-2 opportunity detection because WikiSync data is unavailable.'
          else
            python3 leagues-tracker-112321-2/opportunity_detector.py
          fi

      - name: Validate tracker invariants
        run: |
          python3 leagues-tracker/test_tracker.py
          python3 leagues-tracker/test_opportunities.py
          python3 -m py_compile leagues-tracker-112321-2/tracker.py leagues-tracker-112321-2/task_intelligence.py leagues-tracker-112321-2/opportunity_detector.py

      - name: Commit refreshed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A leagues-tracker leagues-tracker-112321-2
          git commit -m 'Refresh Equilibrium tracker state' || exit 0
          git pull --rebase origin main
          git push origin main
