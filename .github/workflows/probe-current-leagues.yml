name: Probe Current RS3 Leagues Sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-current-leagues.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve previous live snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -f leagues-tracker/live-wikisync.json ]; then
            cp leagues-tracker/live-wikisync.json /tmp/previous-live-wikisync.json
          fi

      - name: Fetch fresh League sources
        shell: bash
        run: |
          set -euo pipefail
          UA='RS3-Stuff-Leagues-Probe/2.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          TS="$(date +%s)"
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            -o leagues-tracker/live-wikisync.json \
            "https://sync.runescape.wiki/runescape/player/112321/LEAGUE_2?tracker_ts=${TS}"
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o task-catalog.html \
            "https://scapeleagues.com/rs3/equilibrium/tasks?tracker_ts=${TS}"
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o leagues-tracker/live-hiscores.html \
            "https://rs.runescape.com/hiscores/leagues/player/112321?tracker_ts=${TS}"

      - name: Build live tracker state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          root=Path('leagues-tracker')
          w=json.loads((root/'live-wikisync.json').read_text())
          config=json.loads((root/'config.json').read_text()) if (root/'config.json').exists() else {}
          raw=Path('task-catalog.html').read_text(encoding='utf-8')

          # Parse current ScapeLeagues task catalog from the Next.js payload.
          chunks=[]
          rx=re.compile(r'self\.__next_f\.push\(\[1,("(?:\\.|[^"\\])*")\]\)',re.S)
          for m in rx.finditer(raw):
              try: chunks.append(json.loads(m.group(1)))
              except Exception: pass
          decoded='\n'.join(chunks)
          dec=json.JSONDecoder(); pos=0; found={}
          while True:
              pos=decoded.find('{"id":"',pos)
              if pos<0: break
              try: obj,end=dec.raw_decode(decoded[pos:])
              except Exception:
                  pos+=1; continue
              pos+=max(end,1)
              if isinstance(obj,dict) and {'id','name','tier','region','points'} <= set(obj):
                  try:
                      tid=int(obj['id'])
                      found[tid]={
                          'id':tid,
                          'name':str(obj.get('name','')).strip(),
                          'description':str(obj.get('description','')).strip(),
                          'tier':str(obj.get('tier','')).lower(),
                          'region':str(obj.get('region','')).strip(),
                          'points':int(obj.get('points',0)),
                          'blessing_task':bool(obj.get('blessingTask',False)),
                          'issue':obj.get('issue') or None,
                      }
                  except Exception: pass

          ids=sorted({int(x) for x in w.get('league_tasks',[])})
          idset=set(ids)
          levels={k:int(v) for k,v in w.get('levels',{}).items()}
          completed=[found[x] for x in ids if x in found]
          missing=[x for x in ids if x not in found]
          lp=sum(x['points'] for x in completed)
          blessings=sum(1 for x in completed if x['blessing_task'])
          total_level=sum(levels.values())

          # Compare to the immediately previous LIVE WikiSync, not historical latest.json.
          prev={}
          prev_path=Path('/tmp/previous-live-wikisync.json')
          if prev_path.exists():
              try: prev=json.loads(prev_path.read_text())
              except Exception: prev={}
          prev_ids={int(x) for x in prev.get('league_tasks',[])}
          prev_levels={k:int(v) for k,v in prev.get('levels',{}).items()}
          new_ids=sorted(idset-prev_ids)
          new_tasks=[found[x] for x in new_ids if x in found]
          level_ups=[]
          for skill,level in levels.items():
              oldlevel=prev_levels.get(skill,level)
              if level>oldlevel:
                  level_ups.append({'skill':skill,'from':oldlevel,'to':level})

          regions=set(config.get('confirmed_unlocked_regions',[]))
          regions.add('Global')
          unfinished=[t for tid,t in found.items() if tid not in idset]
          accessible=[t for t in unfinished if t['region'] in regions]
          actionable=[t for t in accessible if not t.get('issue')]
          actionable.sort(key=lambda t:(-t['points'], t['tier'], t['region'], t['id']))
          unfinished.sort(key=lambda t:(-t['points'], t['region'], t['id']))

          summary={
              'timestamp_utc':w.get('timestamp'),
              'player':w.get('username','112321'),
              'source':'WikiSync + fresh ScapeLeagues task catalog',
              'league_points':lp,
              'completed_tasks':len(ids),
              'completed_task_ids':ids,
              'total_level':total_level,
              'levels':levels,
              'blessing_tasks_completed':blessings,
              'relic_tier':5 if lp>=6000 else (4 if lp>=3500 else (3 if lp>=1750 else (2 if lp>=750 else 1))),
              'points_to_t5':max(0,6000-lp),
              'tasks_to_second_elective_region':max(0,300-len(ids)),
              'tasks_to_third_elective_region':max(0,450-len(ids)),
              'new_task_ids_since_previous_live_sync':new_ids,
              'new_tasks_since_previous_live_sync':new_tasks,
              'task_delta_since_previous_live_sync':len(idset)-len(prev_ids) if prev_ids else 0,
              'level_ups_since_previous_live_sync':level_ups,
              'catalog_task_count':len(found),
              'mapped_completed_tasks':len(completed),
              'unmapped_completed_task_ids':missing,
              'confirmed_unlocked_regions':config.get('confirmed_unlocked_regions',[]),
              'confirmed_relic_choices':config.get('confirmed_relic_choices',{}),
          }
          (root/'live-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (root/'live-unfinished.json').write_text(json.dumps({
              'timestamp_utc':w.get('timestamp'),
              'unlocked_regions':config.get('confirmed_unlocked_regions',[]),
              'accessible_actionable_count':len(actionable),
              'accessible_actionable_tasks':actionable,
              'all_unfinished_tasks':unfinished,
          },indent=2,sort_keys=True)+'\n')

          choices=config.get('confirmed_relic_choices',{})
          relic_text=', '.join(f"T{k} {v}" for k,v in sorted(choices.items(), key=lambda kv:int(kv[0]))) or 'unset'
          region_text=', '.join(config.get('confirmed_unlocked_regions',[])) or 'unset'
          skill_rows='\n'.join(f"| {s} | {n} |" for s,n in sorted(levels.items(), key=lambda kv:(-kv[1],kv[0])))
          md=f'''# RS3 Equilibrium account state — {w.get('username','112321')}

Live WikiSync timestamp: **{w.get('timestamp')}**

## Current concrete state

- **{lp:,} LP**
- **{len(ids)} tasks** completed
- **{max(0,6000-lp):,} LP to T5**
- **{blessings} blessing tasks** completed
- **{total_level:,} total level**
- Confirmed unlocked regions: **{region_text}**
- Confirmed relics: **{relic_text}**

## Current skill levels

| Skill | Level |
|---|---:|
{skill_rows}

## Tracker rules

- `live-summary.json` is the authoritative current snapshot.
- `live-unfinished.json` is the authoritative task shortlist source; never recommend an ID absent from that file's unfinished lists.
- `config.json` is authoritative for manually confirmed relic/region choices.
- `latest.json` is historical only and must not be used as a live completion baseline.
'''
          (root/'assistant-context.md').write_text(md)
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit live probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            leagues-tracker/live-wikisync.json \
            leagues-tracker/live-summary.json \
            leagues-tracker/live-unfinished.json \
            leagues-tracker/live-hiscores.html \
            leagues-tracker/assistant-context.md
          git commit -m 'Refresh live League tracker state' || exit 0
          git push
