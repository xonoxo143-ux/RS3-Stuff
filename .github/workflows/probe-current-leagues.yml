name: Refresh Equilibrium Tracker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-current-leagues.yml'
      - 'leagues-tracker/tracker.py'
      - 'leagues-tracker/test_tracker.py'
      - 'leagues-tracker/league-rules.json'
      - 'leagues-tracker/player-state.json'
      - 'leagues-tracker/task-overrides.json'

permissions:
  contents: write

concurrency:
  group: equilibrium-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch authoritative WikiSync state
        shell: bash
        run: |
          set -euo pipefail
          UA='RS3-Stuff-Equilibrium-Tracker/4.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' \
            -o leagues-tracker/live-wikisync.json \
            'https://sync.runescape.wiki/runescape/player/112321/LEAGUE_2'

      - name: Fetch optional enrichment sources
        shell: bash
        run: |
          set -u
          UA='RS3-Stuff-Equilibrium-Tracker/4.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'
          rm -f task-catalog.html
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' -o task-catalog.html 'https://scapeleagues.com/rs3/equilibrium/tasks' || rm -f task-catalog.html
          rm -f leagues-tracker/live-hiscores.html
          curl -fsS -L --compressed -A "$UA" -H 'Cache-Control: no-cache' -o leagues-tracker/live-hiscores.html 'https://rs.runescape.com/hiscores/leagues/player/112321' || rm -f leagues-tracker/live-hiscores.html

      - name: Build tracker intelligence
        run: python3 leagues-tracker/tracker.py

      - name: Validate tracker invariants
        run: python3 leagues-tracker/test_tracker.py

      - name: Commit refreshed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A leagues-tracker
          git commit -m 'Refresh Equilibrium tracker state' || exit 0
          git pull --rebase origin main
          git push origin main
