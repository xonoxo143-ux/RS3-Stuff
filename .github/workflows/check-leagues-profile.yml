name: Track RS3 Leagues Profile

on:
  push:
    paths:
      - '.github/workflows/check-leagues-profile.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs3-leagues-profile-history
  cancel-in-progress: false

jobs:
  track-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch live League sources
        shell: bash
        run: |
          set -euo pipefail
          UA='RS3-Stuff-Leagues-Tracker/3.0 (GitHub Actions; github.com/xonoxo143-ux/RS3-Stuff)'

          HISCORES_URL='https://rs.runescape.com/hiscores/leagues/player/112321'
          WIKISYNC_URL='https://sync.runescape.wiki/runescape/player/112321/LEAGUE_2'
          CATALOG_URL='https://scapeleagues.com/rs3/equilibrium/tasks'

          HISCORES_STATUS=$(curl -sS -L --compressed --connect-timeout 20 --max-time 60 \
            -A "$UA" -o profile.html -w '%{http_code}' "$HISCORES_URL")
          echo "HISCORES_HTTP_STATUS=$HISCORES_STATUS"
          test "$HISCORES_STATUS" = "200"

          WIKISYNC_STATUS=$(curl -sS -L --compressed --connect-timeout 20 --max-time 60 \
            -A "$UA" -o wikisync.json -w '%{http_code}' "$WIKISYNC_URL")
          echo "WIKISYNC_HTTP_STATUS=$WIKISYNC_STATUS"
          test "$WIKISYNC_STATUS" = "200"

          CATALOG_STATUS=$(curl -sS -L --compressed --connect-timeout 20 --max-time 60 \
            -A "$UA" -o task-catalog.html -w '%{http_code}' "$CATALOG_URL" || true)
          echo "TASK_CATALOG_HTTP_STATUS=$CATALOG_STATUS"
          if [ "$CATALOG_STATUS" != "200" ]; then
            rm -f task-catalog.html
          fi

      - name: Build assistant-ready League intelligence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p leagues-tracker

          python3 - <<'PY'
          import collections
          import datetime as dt
          import html
          import json
          import re
          from pathlib import Path

          ROOT = Path('leagues-tracker')
          PLAYER = '112321'
          LEAGUE = 'Leagues II: Equilibrium'
          WIKISYNC_PROFILE = 'LEAGUE_2'
          CATALOG_URL = 'https://scapeleagues.com/rs3/equilibrium/tasks'
          LEAGUE_END_DATE = dt.date(2026, 9, 21)

          RELIC_THRESHOLDS = [
              {'tier': 1, 'points': 10},
              {'tier': 2, 'points': 750},
              {'tier': 3, 'points': 1750},
              {'tier': 4, 'points': 3500},
              {'tier': 5, 'points': 6000},
              {'tier': 6, 'points': 12000},
              {'tier': 7, 'points': 20000},
          ]
          REGION_THRESHOLDS = [
              {'tasks': 50, 'name': 'Karamja automatic unlock'},
              {'tasks': 175, 'name': 'First elective region'},
              {'tasks': 300, 'name': 'Second elective region'},
              {'tasks': 450, 'name': 'Third elective region'},
          ]
          BLESSING_THRESHOLDS = [
              {'step': 'Tier 1', 'tasks': 1},
              {'step': 'Tier 2', 'tasks': 3},
              {'step': 'Tier 3', 'tasks': 5},
              {'step': 'God Tier 1', 'tasks': 9},
              {'step': 'Tier 4', 'tasks': 12},
              {'step': 'Tier 5', 'tasks': 16},
              {'step': 'Tier 6', 'tasks': 20},
              {'step': 'God Tier 2', 'tasks': 26},
          ]
          TROPHY_THRESHOLDS = [
              {'name': 'Bronze', 'points': 2000},
              {'name': 'Iron', 'points': 4000},
              {'name': 'Steel', 'points': 10000},
              {'name': 'Mithril', 'points': 17000},
              {'name': 'Adamant', 'points': 25000},
              {'name': 'Rune', 'points': 35000},
              {'name': 'Dragon', 'points': 48000},
          ]
          TIER_ORDER = {'easy': 0, 'medium': 1, 'hard': 2, 'elite': 3, 'master': 4}
          START_REGIONS = {'Misthalin', 'Havenhythe'}

          def load_json(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except (FileNotFoundError, json.JSONDecodeError, TypeError, ValueError):
                  return default

          def write_json(path, data):
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, sort_keys=True, ensure_ascii=False)
                  f.write('\n')

          def parse_iso(value):
              if not value:
                  return None
              try:
                  return dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
              except Exception:
                  return None

          def normalize_task(obj):
              return {
                  'id': int(obj['id']),
                  'name': str(obj.get('name', '')).strip(),
                  'description': str(obj.get('description', '')).strip(),
                  'tier': str(obj.get('tier', '')).lower(),
                  'region': str(obj.get('region', '')).strip(),
                  'points': int(obj.get('points', 0)),
                  'blessing_task': bool(obj.get('blessingTask', False)),
                  'issue': obj.get('issue') or None,
              }

          def parse_scapeleagues_catalog(path):
              raw_page = Path(path).read_text(encoding='utf-8')
              decoded_chunks = []
              flight_re = re.compile(r'self\.__next_f\.push\(\[1,("(?:\\.|[^"\\])*")\]\)', re.S)
              for match in flight_re.finditer(raw_page):
                  try:
                      decoded_chunks.append(json.loads(match.group(1)))
                  except Exception:
                      pass
              decoded = '\n'.join(decoded_chunks)
              decoder = json.JSONDecoder()
              found = {}
              pos = 0
              while True:
                  pos = decoded.find('{"id":"', pos)
                  if pos < 0:
                      break
                  try:
                      obj, end = decoder.raw_decode(decoded[pos:])
                  except Exception:
                      pos += 1
                      continue
                  pos += max(end, 1)
                  if isinstance(obj, dict) and {'id', 'name', 'tier', 'region', 'points'} <= set(obj):
                      try:
                          task = normalize_task(obj)
                      except Exception:
                          continue
                      found[task['id']] = task
              return sorted(found.values(), key=lambda x: x['id'])

          def task_ref(task):
              if not task:
                  return None
              return {
                  'id': task['id'],
                  'name': task['name'],
                  'tier': task['tier'],
                  'region': task['region'],
                  'points': task['points'],
                  'blessing_task': task['blessing_task'],
                  'issue': task['issue'],
              }

          def task_breakdown(items):
              by_tier = collections.Counter()
              by_region = collections.Counter()
              points_by_tier = collections.Counter()
              points_by_region = collections.Counter()
              for task in items:
                  tier = task.get('tier') or 'unknown'
                  region = task.get('region') or 'unknown'
                  points = int(task.get('points') or 0)
                  by_tier[tier] += 1
                  by_region[region] += 1
                  points_by_tier[tier] += points
                  points_by_region[region] += points
              return {
                  'count_by_tier': dict(sorted(by_tier.items(), key=lambda kv: TIER_ORDER.get(kv[0], 99))),
                  'count_by_region': dict(sorted(by_region.items())),
                  'points_by_tier': dict(sorted(points_by_tier.items(), key=lambda kv: TIER_ORDER.get(kv[0], 99))),
                  'points_by_region': dict(sorted(points_by_region.items())),
              }

          now_dt = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          now = now_dt.isoformat()
          days_remaining = max(0, (LEAGUE_END_DATE - now_dt.date()).days)

          # ---------- User strategy/config ----------
          config = load_json(ROOT / 'config.json', {})
          confirmed_regions = set(config.get('confirmed_unlocked_regions', []))
          planned_regions = list(config.get('planned_optional_regions', []))
          relic_choices = config.get('confirmed_relic_choices', {})

          # ---------- Parse Jagex HiScores ----------
          raw = Path('profile.html').read_text(encoding='utf-8')

          def clean(s):
              return html.unescape(re.sub(r'<[^>]+>', '', s)).strip()

          def first(pattern, default=None):
              match = re.search(pattern, raw, re.S | re.I)
              return clean(match.group(1)) if match else default

          total_patterns = {
              'total_level': r'>Level</h2>.*?>Total</p>.*?totalValue[^>]*>([\d,]+)</p>',
              'total_xp': r'>XP</h2>.*?>Total</p>.*?totalValue[^>]*>([\d,]+)</p>',
              'league_points': r'>LP</h2>.*?>Total</p>.*?totalValue[^>]*>([\d,]+)</p>',
          }
          totals = {}
          for key, pattern in total_patterns.items():
              value = first(pattern)
              totals[key] = int(value.replace(',', '')) if value else None

          skill_re = re.compile(
              r'skillName[^>]*>([^<]+)</span>.*?'
              r'levelIcon[^>]*></span><div>([\d,]+)</div>.*?'
              r'xpIcon[^>]*></span><div>([\d,]+)</div>',
              re.S | re.I,
          )
          skills = {}
          for name, level, xp in skill_re.findall(raw):
              name = clean(name)
              if name not in skills:
                  skills[name] = {
                      'level': int(level.replace(',', '')),
                      'xp': int(xp.replace(',', '')),
                  }

          if totals['league_points'] is None or totals['total_level'] is None or not skills:
              raise RuntimeError('Jagex HiScores page was reachable, but profile parsing failed')

          # ---------- Parse WikiSync ----------
          wikisync = load_json('wikisync.json', {})
          completed_task_ids = wikisync.get('league_tasks')
          if not isinstance(completed_task_ids, list):
              raise RuntimeError('WikiSync response did not contain a league_tasks list')
          completed_task_ids = sorted({int(x) for x in completed_task_ids})
          wikisync_timestamp = wikisync.get('timestamp')

          # ---------- Refresh/fallback task catalog ----------
          cached_catalog_doc = load_json(ROOT / 'task-catalog.json', {})
          catalog_tasks = []
          catalog_status = 'unavailable'
          catalog_fetched_at = cached_catalog_doc.get('fetched_at_utc')

          if Path('task-catalog.html').exists():
              try:
                  fresh = parse_scapeleagues_catalog('task-catalog.html')
                  if len(fresh) >= 1100:
                      catalog_tasks = fresh
                      catalog_status = 'fresh'
                      catalog_fetched_at = now
              except Exception as exc:
                  print(f'Fresh task catalog parse failed: {exc!r}')

          if not catalog_tasks:
              cached = cached_catalog_doc.get('tasks')
              if isinstance(cached, list) and len(cached) >= 1100:
                  catalog_tasks = cached
                  catalog_status = 'cached'

          catalog_by_id = {int(task['id']): task for task in catalog_tasks if isinstance(task, dict) and 'id' in task}

          if catalog_tasks:
              catalog_doc = {
                  'schema_version': 1,
                  'source_url': CATALOG_URL,
                  'source': 'ScapeLeagues Equilibrium task database',
                  'upstream_attribution': 'Task data credited by ScapeLeagues to the RuneScape Wiki (CC BY-NC-SA 3.0).',
                  'fetched_at_utc': catalog_fetched_at,
                  'task_count': len(catalog_tasks),
                  'tasks': catalog_tasks,
              }
              write_json(ROOT / 'task-catalog.json', catalog_doc)

          # ---------- Current task details ----------
          completed_tasks = []
          missing_catalog_ids = []
          for task_id in completed_task_ids:
              task = catalog_by_id.get(task_id)
              if task:
                  completed_tasks.append(task)
              else:
                  missing_catalog_ids.append(task_id)

          completed_set = set(completed_task_ids)
          completed_catalog_points = sum(int(task.get('points', 0)) for task in completed_tasks)
          lp = totals['league_points']
          lp_catalog_delta = lp - completed_catalog_points if catalog_tasks else None

          observed_regions = {
              task['region'] for task in completed_tasks
              if task.get('region') and task.get('region') != 'Global'
          }
          inferred_regions = set(START_REGIONS) | confirmed_regions | observed_regions
          if len(completed_task_ids) >= 50:
              inferred_regions.add('Karamja')
          accessible_regions = sorted(inferred_regions)

          # ---------- Previous state / changes ----------
          history = load_json(ROOT / 'history.json', [])
          if not isinstance(history, list):
              history = []
          previous = history[-1] if history else None
          previous_task_set = set(previous.get('completed_task_ids', [])) if previous else set()
          new_task_ids = sorted(completed_set - previous_task_set) if previous else []
          removed_task_ids = sorted(previous_task_set - completed_set) if previous else []
          new_tasks = [catalog_by_id[x] for x in new_task_ids if x in catalog_by_id]
          removed_tasks = [catalog_by_id[x] for x in removed_task_ids if x in catalog_by_id]

          delta = {
              'has_previous_snapshot': bool(previous),
              'elapsed_hours': None,
              'league_points': 0,
              'total_level': 0,
              'total_xp': 0,
              'completed_tasks': 0,
              'new_task_ids': new_task_ids,
              'new_tasks': [task_ref(x) for x in new_tasks],
              'removed_task_ids': removed_task_ids,
              'removed_tasks': [task_ref(x) for x in removed_tasks],
              'level_ups': [],
              'xp_gains': [],
              'rates': {'lp_per_hour': None, 'tasks_per_hour': None, 'xp_per_hour': None, 'levels_per_hour': None},
          }

          if previous:
              prev_dt = parse_iso(previous.get('timestamp_utc'))
              elapsed_hours = (now_dt - prev_dt).total_seconds() / 3600 if prev_dt else None
              if elapsed_hours and elapsed_hours > 0:
                  delta['elapsed_hours'] = round(elapsed_hours, 3)

              delta['league_points'] = lp - int(previous.get('league_points', lp))
              delta['total_level'] = totals['total_level'] - int(previous.get('total_level', totals['total_level']))
              delta['total_xp'] = totals['total_xp'] - int(previous.get('total_xp', totals['total_xp']))
              delta['completed_tasks'] = len(completed_task_ids) - int(previous.get('completed_task_count', len(completed_task_ids)))

              prev_skills = previous.get('skills', {})
              for name, cur in skills.items():
                  old = prev_skills.get(name, {})
                  old_level = int(old.get('level', cur['level']))
                  old_xp = int(old.get('xp', cur['xp']))
                  if cur['level'] > old_level:
                      delta['level_ups'].append({
                          'skill': name,
                          'from': old_level,
                          'to': cur['level'],
                          'levels_gained': cur['level'] - old_level,
                      })
                  xp_gain = cur['xp'] - old_xp
                  if xp_gain > 0:
                      delta['xp_gains'].append({'skill': name, 'xp_gained': xp_gain})

              delta['level_ups'].sort(key=lambda x: (-x['levels_gained'], x['skill']))
              delta['xp_gains'].sort(key=lambda x: (-x['xp_gained'], x['skill']))
              if elapsed_hours and elapsed_hours > 0:
                  delta['rates'] = {
                      'lp_per_hour': round(delta['league_points'] / elapsed_hours, 2),
                      'tasks_per_hour': round(delta['completed_tasks'] / elapsed_hours, 2),
                      'xp_per_hour': round(delta['total_xp'] / elapsed_hours, 2),
                      'levels_per_hour': round(delta['total_level'] / elapsed_hours, 2),
                  }

          # ---------- Progression tracks ----------
          current_relic = max((x for x in RELIC_THRESHOLDS if lp >= x['points']), key=lambda x: x['tier'], default=None)
          next_relic = next((x for x in RELIC_THRESHOLDS if lp < x['points']), None)
          task_count = len(completed_task_ids)
          next_region = next((x for x in REGION_THRESHOLDS if task_count < x['tasks']), None)

          blessing_completed_tasks = [task for task in completed_tasks if task.get('blessing_task')]
          blessing_count = len(blessing_completed_tasks)
          current_blessing = max((x for x in BLESSING_THRESHOLDS if blessing_count >= x['tasks']), key=lambda x: x['tasks'], default=None)
          next_blessing = next((x for x in BLESSING_THRESHOLDS if blessing_count < x['tasks']), None)

          current_trophy = max((x for x in TROPHY_THRESHOLDS if lp >= x['points']), key=lambda x: x['points'], default=None)
          next_trophy = next((x for x in TROPHY_THRESHOLDS if lp < x['points']), None)

          next_planned_region = next((r for r in planned_regions if r not in inferred_regions), None)

          progression = {
              'league_points': lp,
              'relic_tier': current_relic['tier'] if current_relic else 0,
              'next_relic_tier': next_relic['tier'] if next_relic else None,
              'next_relic_points': next_relic['points'] if next_relic else None,
              'points_to_next_relic': max(0, next_relic['points'] - lp) if next_relic else 0,
              'completed_tasks': task_count,
              'next_region_unlock': next_region['name'] if next_region else None,
              'next_region_task_threshold': next_region['tasks'] if next_region else None,
              'tasks_to_next_region_unlock': max(0, next_region['tasks'] - task_count) if next_region else 0,
              'inferred_unlocked_regions': accessible_regions,
              'next_planned_region': next_planned_region,
              'blessing_tasks_completed': blessing_count,
              'blessing_step': current_blessing['step'] if current_blessing else 'none',
              'next_blessing_step': next_blessing['step'] if next_blessing else None,
              'blessing_tasks_to_next_step': max(0, next_blessing['tasks'] - blessing_count) if next_blessing else 0,
              'trophy': current_trophy['name'] if current_trophy else 'none',
              'next_trophy': next_trophy['name'] if next_trophy else None,
              'points_to_next_trophy': max(0, next_trophy['points'] - lp) if next_trophy else 0,
              'total_level': totals['total_level'],
              'total_xp': totals['total_xp'],
              'league_end_date': LEAGUE_END_DATE.isoformat(),
              'calendar_days_remaining': days_remaining,
          }

          # ---------- Skill intelligence ----------
          skill_rows = [
              {'name': name, 'level': data['level'], 'xp': data['xp']}
              for name, data in skills.items()
          ]
          skill_rows_desc = sorted(skill_rows, key=lambda x: (-x['level'], -x['xp'], x['name']))
          skill_rows_asc = sorted(skill_rows, key=lambda x: (x['level'], x['xp'], x['name']))
          milestone_rows = []
          for row in skill_rows:
              for target in (50, 70, 80, 90, 99):
                  if row['level'] < target:
                      milestone_rows.append({
                          'skill': row['name'],
                          'current_level': row['level'],
                          'target_level': target,
                          'levels_needed': target - row['level'],
                      })
                      break
          milestone_rows.sort(key=lambda x: (x['levels_needed'], x['target_level'], x['skill']))

          skill_summary = {
              '99_or_higher': [x['name'] for x in skill_rows_desc if x['level'] >= 99],
              '80_or_higher': [x['name'] for x in skill_rows_desc if x['level'] >= 80],
              'below_20': [x['name'] for x in skill_rows_asc if x['level'] < 20],
              'level_1_or_lower': [x['name'] for x in skill_rows_asc if x['level'] <= 1],
              'highest': skill_rows_desc[:8],
              'lowest': skill_rows_asc[:8],
              'nearest_standard_level_milestones': milestone_rows[:10],
          }

          # ---------- Task routing pools ----------
          accessible_uncompleted = []
          clean_accessible = []
          issue_accessible = []
          if catalog_tasks:
              for task in catalog_tasks:
                  if task['id'] in completed_set:
                      continue
                  if task['region'] != 'Global' and task['region'] not in inferred_regions:
                      continue
                  accessible_uncompleted.append(task)
                  if task.get('issue'):
                      issue_accessible.append(task)
                  else:
                      clean_accessible.append(task)

          task_count_candidates = sorted(
              clean_accessible,
              key=lambda x: (TIER_ORDER.get(x['tier'], 99), x['region'], x['name'])
          )
          blessing_candidates = sorted(
              [x for x in clean_accessible if x.get('blessing_task')],
              key=lambda x: (TIER_ORDER.get(x['tier'], 99), x['region'], x['name'])
          )
          high_point_candidates = sorted(
              clean_accessible,
              key=lambda x: (-x['points'], TIER_ORDER.get(x['tier'], 99), x['region'], x['name'])
          )

          # Region density is useful before spending a permanent region pick.
          region_summary = {}
          for region in sorted({x['region'] for x in catalog_tasks if x.get('region') and x['region'] != 'Global'}):
              items = [x for x in catalog_tasks if x['region'] == region]
              clean_items = [x for x in items if not x.get('issue')]
              blessings = [x for x in items if x.get('blessing_task')]
              region_summary[region] = {
                  'total_tasks': len(items),
                  'total_points': sum(x['points'] for x in items),
                  'non_issue_tasks': len(clean_items),
                  'non_issue_points': sum(x['points'] for x in clean_items),
                  'blessing_tasks': len(blessings),
                  'tier_counts': dict(collections.Counter(x['tier'] for x in items)),
                  'blessing_tier_counts': dict(collections.Counter(x['tier'] for x in blessings)),
                  'currently_inferred_unlocked': region in inferred_regions,
                  'planned': region in planned_regions,
              }

          completed_breakdown = task_breakdown(completed_tasks)
          task_pools = {
              'schema_version': 1,
              'timestamp_utc': now,
              'candidate_pool_note': 'Pools are filtered by completed state, inferred/confirmed region access, and known issue flags. The catalog does not expose skill requirements, so candidates are not guaranteed to be immediately doable.',
              'inferred_unlocked_regions': accessible_regions,
              'counts': {
                  'accessible_uncompleted': len(accessible_uncompleted),
                  'clean_accessible_uncompleted': len(clean_accessible),
                  'known_issue_accessible': len(issue_accessible),
                  'blessing_candidates': len(blessing_candidates),
              },
              'task_count_candidates_top_75': [task_ref(x) for x in task_count_candidates[:75]],
              'blessing_candidates': [task_ref(x) for x in blessing_candidates],
              'high_point_candidates_top_50': [task_ref(x) for x in high_point_candidates[:50]],
              'known_issue_tasks_accessible': [task_ref(x) for x in issue_accessible],
          }

          # ---------- Canonical snapshot ----------
          snapshot = {
              'schema_version': 3,
              'timestamp_utc': now,
              'player': PLAYER,
              'league': LEAGUE,
              'sources': {
                  'jagex_hiscores': 'https://rs.runescape.com/hiscores/leagues/player/112321',
                  'wikisync_profile': WIKISYNC_PROFILE,
                  'wikisync_timestamp': wikisync_timestamp,
                  'task_catalog_url': CATALOG_URL,
                  'task_catalog_status': catalog_status,
                  'task_catalog_fetched_at_utc': catalog_fetched_at,
              },
              **totals,
              'skills': skills,
              'completed_task_count': task_count,
              'completed_task_ids': completed_task_ids,
              'derived': {
                  'progression': progression,
                  'skill_summary': skill_summary,
                  'completed_task_breakdown': completed_breakdown,
                  'data_consistency': {
                      'catalog_task_count': len(catalog_tasks),
                      'mapped_completed_tasks': len(completed_tasks),
                      'unmapped_completed_task_ids': missing_catalog_ids,
                      'catalog_points_from_completed_tasks': completed_catalog_points if catalog_tasks else None,
                      'hiscores_lp_minus_catalog_completed_points': lp_catalog_delta,
                  },
              },
              'changes_since_previous_snapshot': delta,
          }

          history.append(snapshot)
          history = history[-6:]
          timeline = [
              {
                  'timestamp_utc': item.get('timestamp_utc'),
                  'league_points': item.get('league_points'),
                  'total_level': item.get('total_level'),
                  'total_xp': item.get('total_xp'),
                  'completed_tasks': item.get('completed_task_count'),
              }
              for item in history
          ]

          # Six-snapshot trend.
          rolling_rate = {'elapsed_hours': None, 'lp_per_hour': None, 'tasks_per_hour': None, 'xp_per_hour': None, 'levels_per_hour': None}
          if len(history) >= 2:
              oldest = history[0]
              oldest_dt = parse_iso(oldest.get('timestamp_utc'))
              if oldest_dt:
                  hours = (now_dt - oldest_dt).total_seconds() / 3600
                  if hours > 0:
                      rolling_rate = {
                          'elapsed_hours': round(hours, 3),
                          'lp_per_hour': round((lp - int(oldest.get('league_points', lp))) / hours, 2),
                          'tasks_per_hour': round((task_count - int(oldest.get('completed_task_count', task_count))) / hours, 2),
                          'xp_per_hour': round((totals['total_xp'] - int(oldest.get('total_xp', totals['total_xp']))) / hours, 2),
                          'levels_per_hour': round((totals['total_level'] - int(oldest.get('total_level', totals['total_level']))) / hours, 2),
                      }

          tasks_doc = {
              'schema_version': 2,
              'timestamp_utc': now,
              'player': PLAYER,
              'wikisync_profile': WIKISYNC_PROFILE,
              'wikisync_timestamp': wikisync_timestamp,
              'completed_task_count': task_count,
              'completed_task_ids': completed_task_ids,
              'completed_tasks': [task_ref(x) for x in completed_tasks],
              'new_task_ids_since_previous_snapshot': new_task_ids,
              'new_tasks_since_previous_snapshot': [task_ref(x) for x in new_tasks],
              'removed_task_ids_since_previous_snapshot': removed_task_ids,
              'removed_tasks_since_previous_snapshot': [task_ref(x) for x in removed_tasks],
              'breakdown': completed_breakdown,
              'blessing_tasks_completed': [task_ref(x) for x in blessing_completed_tasks],
          }

          changes_doc = {
              'timestamp_utc': now,
              'player': PLAYER,
              'since_previous_snapshot': delta,
              'rolling_six_snapshot_rate': rolling_rate,
          }

          assistant_context = {
              'schema_version': 2,
              'read_me_first': True,
              'timestamp_utc': now,
              'player': PLAYER,
              'league': LEAGUE,
              'strategy_config': config,
              'progression': progression,
              'changes': delta,
              'rolling_six_snapshot_rate': rolling_rate,
              'skill_summary': skill_summary,
              'skills_sorted_high_to_low': skill_rows_desc,
              'task_state': {
                  'completed_count': task_count,
                  'completed_breakdown': completed_breakdown,
                  'new_tasks': [task_ref(x) for x in new_tasks],
                  'blessing_tasks_completed': blessing_count,
              },
              'routing': {
                  'candidate_pool_note': task_pools['candidate_pool_note'],
                  'task_count_candidates_top_25': task_pools['task_count_candidates_top_75'][:25],
                  'blessing_candidates': task_pools['blessing_candidates'],
                  'known_issue_tasks_accessible': task_pools['known_issue_tasks_accessible'],
              },
              'planned_region_summaries': {r: region_summary.get(r) for r in planned_regions if r in region_summary},
              'data_quality': snapshot['derived']['data_consistency'],
              'source_freshness': snapshot['sources'],
          }

          # ---------- Human-readable assistant briefing ----------
          lines = [
              f'# RS3 Equilibrium account state — {PLAYER}',
              '',
              f'Updated: **{now}** · **{days_remaining} calendar days** until {LEAGUE_END_DATE.isoformat()}',
              '',
              '## Read this first',
              '',
              f'- **{lp:,} LP** · relic **T{progression["relic_tier"]}**' + (
                  f' · **{progression["points_to_next_relic"]:,} LP** to T{progression["next_relic_tier"]}' if progression['next_relic_tier'] else ' · all relic tiers reached'
              ),
              f'- **{task_count} tasks** completed' + (
                  f' · **{progression["tasks_to_next_region_unlock"]} tasks** to {progression["next_region_unlock"]}' if progression['next_region_unlock'] else ' · all region milestones reached'
              ),
              f'- Blessings: **{blessing_count} blessing tasks** · current step **{progression["blessing_step"]}**' + (
                  f' · **{progression["blessing_tasks_to_next_step"]}** to {progression["next_blessing_step"]}' if progression['next_blessing_step'] else ' · final blessing step reached'
              ),
              f'- Trophy: **{progression["trophy"]}**' + (
                  f' · **{progression["points_to_next_trophy"]:,} LP** to {progression["next_trophy"]}' if progression['next_trophy'] else ' · Dragon reached'
              ),
              f'- Total level **{totals["total_level"]:,}** · Total XP **{totals["total_xp"]:,}**',
              f'- Inferred/confirmed regions: **{", ".join(accessible_regions)}**',
          ]
          if next_planned_region:
              lines.append(f'- Current planned next optional region: **{next_planned_region}**')

          if relic_choices:
              picks = ', '.join(f'T{tier} {name}' for tier, name in sorted(relic_choices.items(), key=lambda kv: int(kv[0])))
              lines.append(f'- Confirmed relic picks: **{picks}**')

          lines += ['', '## Since previous snapshot', '']
          if previous:
              lines += [
                  f'- LP: **{delta["league_points"]:+,}**',
                  f'- Tasks: **{delta["completed_tasks"]:+,}**',
                  f'- Total levels: **{delta["total_level"]:+,}**',
                  f'- Total XP: **{delta["total_xp"]:+,}**',
              ]
              if new_tasks:
                  lines.append('- New tasks: ' + '; '.join(
                      f'**{x["name"]}** ({x["tier"]}, {x["region"]}, {x["points"]} LP)' for x in new_tasks
                  ))
              elif new_task_ids:
                  lines.append('- New task IDs (catalog mapping unavailable): ' + ', '.join(map(str, new_task_ids)))
              else:
                  lines.append('- New tasks: none')
              lines.append('- Level-ups: ' + ('; '.join(
                  f'{x["skill"]} {x["from"]}→{x["to"]}' for x in delta['level_ups']
              ) if delta['level_ups'] else 'none'))
              if delta['xp_gains']:
                  lines.append('- Largest XP gains: ' + '; '.join(
                      f'{x["skill"]} +{x["xp_gained"]:,}' for x in delta['xp_gains'][:8]
                  ))
              if delta['elapsed_hours']:
                  rates = delta['rates']
                  lines.append(
                      f'- Pace over {delta["elapsed_hours"]:.2f}h: {rates["lp_per_hour"]:+,.1f} LP/h · '
                      f'{rates["tasks_per_hour"]:+,.1f} tasks/h · {rates["xp_per_hour"]:+,.0f} XP/h'
                  )
          else:
              lines.append('- No comparable previous snapshot yet.')

          lines += ['', '## Task routing', '']
          if catalog_tasks:
              lines += [
                  f'- Catalog: **{len(catalog_tasks):,} tasks**, status **{catalog_status}**',
                  f'- Clean incomplete tasks in inferred/confirmed regions: **{len(clean_accessible)}**',
                  f'- Known-issue tasks in those regions to avoid/check first: **{len(issue_accessible)}**',
                  f'- Uncompleted blessing candidates in those regions: **{len(blessing_candidates)}**',
                  '- Candidate warning: the catalog does **not** expose skill requirements, so this is a routing pool, not a claim that every task is immediately doable.',
              ]
              if task_count_candidates:
                  lines.append('- First 12 task-count candidates:')
                  for task in task_count_candidates[:12]:
                      issue = f' · ISSUE: {task["issue"]}' if task.get('issue') else ''
                      lines.append(f'  - [{task["id"]}] {task["name"]} — {task["tier"]}, {task["region"]}, {task["points"]} LP{issue}')
              if blessing_candidates:
                  lines.append('- Blessing candidates currently visible to the tracker:')
                  for task in blessing_candidates[:10]:
                      lines.append(f'  - [{task["id"]}] {task["name"]} — {task["tier"]}, {task["region"]}, {task["points"]} LP')
          else:
              lines.append('- Task catalog unavailable; raw WikiSync IDs are still tracked safely.')

          if planned_regions and region_summary:
              lines += ['', '## Planned region comparison', '']
              for region in planned_regions:
                  summary = region_summary.get(region)
                  if not summary:
                      continue
                  lines.append(
                      f'- **{region}**: {summary["non_issue_tasks"]} non-issue tasks / '
                      f'{summary["non_issue_points"]:,} LP · {summary["blessing_tasks"]} blessing tasks · '
                      f'tiers {summary["tier_counts"]}'
                  )

          lines += [
              '',
              '## Skill highlights',
              '',
              '- 99+: ' + (', '.join(skill_summary['99_or_higher']) or 'none'),
              '- Level 1 or lower: ' + (', '.join(skill_summary['level_1_or_lower']) or 'none'),
              '- Below 20: ' + (', '.join(skill_summary['below_20']) or 'none'),
          ]
          if milestone_rows:
              lines.append('- Nearest standard milestones: ' + '; '.join(
                  f'{x["skill"]} {x["current_level"]}→{x["target_level"]} ({x["levels_needed"]})'
                  for x in milestone_rows[:8]
              ))

          lines += ['', '## Skills', '', '| Skill | Level | XP |', '|---|---:|---:|']
          for row in skill_rows_desc:
              lines.append(f'| {row["name"]} | {row["level"]} | {row["xp"]:,} |')

          lines += [
              '',
              '## Data quality / freshness',
              '',
              f'- WikiSync: **{wikisync_timestamp}** via **{WIKISYNC_PROFILE}**',
              f'- Task catalog: **{catalog_status}**, {len(catalog_tasks):,} mapped tasks',
              f'- Completed task IDs mapped to names: **{len(completed_tasks)}/{task_count}**',
          ]
          if catalog_tasks:
              lines.append(f'- LP consistency: HiScores {lp:,} vs mapped completed-task points {completed_catalog_points:,} · delta **{lp_catalog_delta:+,}**')
          if missing_catalog_ids:
              lines.append('- Unmapped completed IDs: ' + ', '.join(map(str, missing_catalog_ids)))
          lines += [
              '',
              '> Generated automatically. Read `assistant-context.json` for structured state, `tasks.json` for named completions, `task-pools.json` for routing candidates, and `task-catalog.json` for the full Equilibrium task database.',
          ]

          # ---------- Write outputs ----------
          write_json(ROOT / 'latest.json', snapshot)
          write_json(ROOT / 'history.json', history)
          write_json(ROOT / 'timeline.json', timeline)
          write_json(ROOT / 'tasks.json', tasks_doc)
          write_json(ROOT / 'changes.json', changes_doc)
          write_json(ROOT / 'task-pools.json', task_pools)
          write_json(ROOT / 'region-summary.json', region_summary)
          write_json(ROOT / 'assistant-context.json', assistant_context)
          (ROOT / 'assistant-context.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          readme = '''# RS3 Equilibrium tracker\n\nGenerated account intelligence for player `112321`.\n\n- `assistant-context.md` — read this first; concise human/assistant briefing.\n- `assistant-context.json` — structured briefing.\n- `latest.json` — canonical raw+derived current snapshot.\n- `changes.json` — deltas and progress velocity.\n- `tasks.json` — WikiSync completions translated to task names.\n- `task-catalog.json` — full 1,152-task Equilibrium catalog with IDs, names, tiers, regions, points, blessing flags and issue flags.\n- `task-pools.json` — incomplete routing pools for inferred/confirmed accessible regions.\n- `region-summary.json` — task/point/blessing density by region.\n- `history.json` — rolling six full snapshots.\n- `timeline.json` — rolling six compact snapshots.\n- `config.json` — manually confirmed relic/region strategy facts that public APIs cannot observe.\n\nThe workflow runs hourly at minute 17 and can also be dispatched manually. WikiSync is authoritative for task completion IDs; Jagex HiScores is authoritative for LP/levels/XP. The task catalog is refreshed from ScapeLeagues and retains the last valid cached copy if that fetch fails.\n'''
          (ROOT / 'README.md').write_text(readme, encoding='utf-8')

          print('--- ASSISTANT READY ---')
          print(f'LP={lp:,} | Tasks={task_count} | Total={totals["total_level"]:,} | XP={totals["total_xp"]:,}')
          print(f'Catalog={catalog_status}:{len(catalog_tasks)} | Named completions={len(completed_tasks)}/{task_count}')
          print(f'Blessings={blessing_count} | Trophy={progression["trophy"]} | Next region={progression["next_region_unlock"]}')
          print(f'Clean routing pool={len(clean_accessible)} | Blessing candidates={len(blessing_candidates)}')
          PY

      - name: Commit updated tracker state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add leagues-tracker/
          if git diff --cached --quiet; then
            echo 'No tracker changes to commit.'
            exit 0
          fi
          git commit -m 'Update RS3 Leagues hourly intelligence'
          git push
